<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Name }}</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body>
    <h1>{{ .Name }}</h1>
    <a href="/species">Back to Species</a>
    <hr>

    <img
        class="owl-img"
        src="{{ .Image }}"
        alt="{{ .Name }}"
    />

    <p>
        <strong>Scientific name:</strong>
        {{ .ScientificName }}
    </p>

    <p>
        <strong>Region:</strong>
        {{ .Region }}
    </p>

    <h2>About</h2>
    <p>{{ .About }}</p>
</body>
</html>
