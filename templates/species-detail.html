<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Name }}</title>
    <link rel="stylesheet" href="/static/css/main.css" />
  </head>

  <body>
    <div id="wrapper">
      <nav>
        <a href="/species">Back to Species</a>
        <a href="/species-data/{{ .ID }}" style="float: right;">View JSON data</a>
      </nav>
      <header>
        <h1>{{ .Name }}</h1>
      </header>

      <main>
        <img class="owl-img" src="{{ .Image }}" alt="{{ .Name }}" />

        <div class="detail-section">
          <p>
            <strong>Scientific name:</strong>
            {{ .ScientificName }}
            <br />
            <strong>Region:</strong>
            {{ .Region }}
          </p>
        </div>

        <div class="detail-section">
          <h2>About</h2>
          <p>{{ .About }}</p>
        </div>

        <div class="detail-section">
          <h3>Description</h3>
          <p>{{ .Description }}</p>
        </div>

        <div class="detail-section">
          <h3>History</h3>
          <p>{{ .History }}</p>
        </div>
      </main>
    </div>
  </body>
</html>
