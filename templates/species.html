<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Species</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <h1>Species</h1>
    <a href="/home">Back to Home</a>
    <hr>

    <!-- Search species -->
    <input
        type="text"
        id="species-search"
        placeholder="Search for species.."
        autocomplete="off"
    />

    <!-- Display species -->
    <div id="species-list"></div>

    <!-- Appears when nothing matches search -->
    <p id="no-results" hidden>No owl species found..</p>

    <!-- Load JavaScript -->
    <script src="/static/js/species.js"></script>
</body>
</html>
